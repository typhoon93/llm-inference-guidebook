apiVersion: v1
kind: Pod
metadata:
  name: vllm-image-gpu-debug
  namespace: default
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
    - name: debug
      image: vllm/vllm-openai:v0.23.0
      imagePullPolicy: IfNotPresent
      command:
        - python3
        - -c
        - |
          import time
          print("Debug container started; sleeping indefinitely.", flush=True)
          time.sleep(10**9)
      env:
        - name: NVIDIA_VISIBLE_DEVICES
          value: all
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: compute,utility
      resources:
        limits:
          nvidia.com/gpu: 1
        requests:
          nvidia.com/gpu: 1
          cpu: 100m
          memory: 512Mi
